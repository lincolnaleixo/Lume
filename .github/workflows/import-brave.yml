name: Import pinned Brave source
on:
  push:
    branches: [main]
    paths: [.github/workflows/import-brave.yml]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: lume-import-brave
  cancel-in-progress: false
jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Import source snapshot without upstream automation
        shell: bash
        run: |
          set -euo pipefail
          if git ls-remote --exit-code --heads origin upstream/brave-core > /dev/null 2>&1; then
            echo 'Upstream branch already exists; nothing was overwritten.'
            exit 0
          fi
          git remote add brave-upstream https://github.com/brave/brave-core.git
          git fetch --depth=1 --no-tags brave-upstream refs/tags/v1.96.61
          SOURCE=$(git rev-parse 'FETCH_HEAD^{commit}')
          test "$SOURCE" = eb024dd75e048e2661c9e1ed29952987ee73b12a
          git read-tree 'FETCH_HEAD^{tree}'
          git rm --cached -r --ignore-unmatch .github/workflows
          TREE=$(git write-tree)
          git config user.name 'Lume repository automation'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          COMMIT=$(printf '%s\n\n%s\n' 'Import Brave Core v1.96.61 source snapshot' "Upstream: https://github.com/brave/brave-core/commit/$SOURCE. Original licenses retained. Upstream workflows intentionally excluded." | git commit-tree "$TREE" -p "$GITHUB_SHA")
          git push origin "$COMMIT:refs/heads/upstream/brave-core"
          printf 'Imported Brave Core `%s` to `upstream/brave-core`.\n' "$SOURCE" >> "$GITHUB_STEP_SUMMARY"
